<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="LifeSpace Blinds Open Graph image">
  <title>LifeSpace Blinds | Luxury Custom Window Blinds and Smart Shading | Halifax, Nova Scotia</title>
  <desc>Atlantic Canada's premier luxury window treatment studio. Bespoke motorized blinds, custom shades and smart shading for Halifax, Moncton, Charlottetown, Saint John and St. John's.</desc>

  <!-- Background - deep charcoal -->
  <rect width="1200" height="630" fill="#1C1C1A"/>

  <!-- Animated blind slat texture overlay -->
