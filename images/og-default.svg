  <g transform="translate(940, 165)">
    <rect x="0"  y="0"   width="180" height="12" rx="2" fill="#B8965A" opacity="0.90"/>
    <rect x="0"  y="26"  width="180" height="12" rx="2" fill="#B8965A" opacity="0.75"/>
    <rect x="0"  y="52"  width="180" height="12" rx="2" fill="#B8965A" opacity="0.60"/>
    <rect x="0"  y="78"  width="180" height="12" rx="2" fill="#B8965A" opacity="0.45"/>
    <rect x="0"  y="104" width="180" height="12" rx="2" fill="#B8965A" opacity="0.30"/>
    <rect x="0"  y="130" width="180" height="12" rx="2" fill="#B8965A" opacity="0.18"/>
    <rect x="0"  y="156" width="180" height="12" rx="2" fill="#B8965A" opacity="0.10"/>
    <!-- Lift cord -->
    <line x1="158" y1="0" x2="158" y2="175" stroke="#B8965A" stroke-width="2" opacity="0.25"/>
  </g>

  <!-- Bottom gold rule -->
  <rect x="0" y="590" width="1200" height="1" fill="#B8965A" opacity="0.15"/>

  <!-- Rating badge -->
  <rect x="96" y="580" width="220" height="32" rx="2" fill="#B8965A" opacity="0.12"/>
  <text x="106" y="601"
