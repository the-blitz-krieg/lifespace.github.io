  <rect x="0" y="0"   width="1200" height="2" fill="#B8965A" opacity="0.12"/>
  <rect x="0" y="46"  width="1200" height="2" fill="#B8965A" opacity="0.10"/>
  <rect x="0" y="92"  width="1200" height="2" fill="#B8965A" opacity="0.10"/>
  <rect x="0" y="138" width="1200" height="2" fill="#B8965A" opacity="0.10"/>
  <rect x="0" y="184" width="1200" height="2" fill="#B8965A" opacity="0.10"/>
  <rect x="0" y="230" width="1200" height="2" fill="#B8965A" opacity="0.10"/>
  <rect x="0" y="276" width="1200" height="2" fill="#B8965A" opacity="0.10"/>
  <rect x="0" y="322" width="1200" height="2" fill="#B8965A" opacity="0.10"/>
  <rect x="0" y="368" width="1200" height="2" fill="#B8965A" opacity="0.10"/>
  <rect x="0" y="414" width="1200" height="2" fill="#B8965A" opacity="0.10"/>
  <rect x="0" y="460" width="1200" height="2" fill="#B8965A" opacity="0.10"/>
  <rect x="0" y="506" width="1200" height="2" fill="#B8965A" opacity="0.10"/>
  <rect x="0" y="552" width="1200" height="2" fill="#B8965A" opacity="0.10"/>
  <rect x="0" y="598" width="1200" height="2" fill="#B8965A" opacity="0.10"/>
  <rect x="0" y="628" width="1200" height="2" fill="#B8965A" opacity="0.10"/>

  <!-- Right panel - lighter charcoal, angled clip -->
  <polygon points="820,0 1200,0 1200,630 680,630" fill="#2E2E2B" opacity="0.6"/>

  <!-- Gold accent vertical rule -->
  <rect x="76" y="180" width="1" height="280" fill="#B8965A" opacity="0.6"/>

  <!-- Top label -->
  <text x="96" y="218"
    font-family="'Jost', 'Arial', sans-serif"
    font-size="13"
    font-weight="400"
    fill="#B8965A"
    letter-spacing="5">HALIFAX · ATLANTIC CANADA · EST. 2014</text>

  <!-- Main wordmark -->
  <text x="96" y="330"
