<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="LifeSpace Blinds logo">
  <title>LifeSpace Blinds</title>
  <desc>LifeSpace Blinds - Luxury custom window blinds and smart shading for Atlantic Canada</desc>

  <!-- Blind slat mark - 5 horizontal slats suggesting a window blind -->
  <g transform="translate(0,8)">
    <!-- Slat 1 - full width -->
    <rect x="0" y="0"  width="56" height="5" rx="1" fill="#B8965A"/>
    <!-- Slat 2 - slightly offset, partial open -->
    <rect x="0" y="10" width="56" height="5" rx="1" fill="#B8965A" opacity="0.85"/>
    <!-- Slat 3 -->
    <rect x="0" y="20" width="56" height="5" rx="1" fill="#B8965A" opacity="0.70"/>
    <!-- Slat 4 -->
    <rect x="0" y="30" width="56" height="5" rx="1" fill="#B8965A" opacity="0.55"/>
    <!-- Slat 5 - most open/transparent -->
    <rect x="0" y="40" width="56" height="5" rx="1" fill="#B8965A" opacity="0.35"/>
    <!-- Lift cord - thin vertical line -->
    <line x1="48" y1="0" x2="48" y2="52" stroke="#B8965A" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Wordmark: LifeSpace -->
  <text x="72" y="38"
    font-family="'Cormorant Garamond', 'Georgia', serif"
    font-size="28"
    font-weight="400"
    fill="#1C1C1A"
    letter-spacing="0.5">LifeSpace</text>

  <!-- Wordmark: Blinds - slightly smaller, gold -->
  <text x="72" y="62"
    font-family="'Jost', 'Arial', sans-serif"
    font-size="11"
    font-weight="300"
    fill="#B8965A"
    letter-spacing="5">BLINDS</text>

  <!-- Thin gold rule between name and tagline area -->
  <line x1="72" y1="43" x2="310" y2="43" stroke="#B8965A" stroke-width="0.5" opacity="0.3"/>
</svg>
